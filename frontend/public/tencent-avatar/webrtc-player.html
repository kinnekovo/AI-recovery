<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>腾讯云数字人</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #player { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #eef6f2; }
    #player video { width: 100% !important; height: 100% !important; object-fit: contain !important; }
    .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(238, 246, 242, .9); color: #345047; font: 600 15px/1.5 system-ui, sans-serif; z-index: 2; }
    .overlay[hidden] { display: none; }
    .sound { position: fixed; left: 50%; bottom: 14px; min-height: 48px; padding: 0 20px; transform: translateX(-50%); border: 0; border-radius: 24px; background: #176b55; color: #fff; font: 700 16px/1 system-ui, sans-serif; cursor: pointer; box-shadow: 0 8px 24px rgba(20, 35, 30, .18); z-index: 3; }
    .sound[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="overlay" class="overlay">正在连接数字人画面…</div>
  <button id="sound" class="sound" type="button" hidden>开启声音</button>
  <script src="./TcPlayer-2.4.5.js" charset="utf-8"></script>
  <script>
    const streamUrl = new URLSearchParams(location.search).get('url') || ''
    const overlay = document.getElementById('overlay')
    const sound = document.getElementById('sound')
    let player = null

    function muteUnderlyingVideo(callback) {
      let attempts = 0
      const timer = setInterval(() => {
        const videos = document.querySelectorAll('#player video')
        if (videos.length || attempts++ > 20) {
          videos.forEach((video) => { video.muted = true; video.volume = 0 })
          clearInterval(timer)
          if (callback) callback()
        }
      }, 100)
    }

    function fail(message) {
      overlay.hidden = false
      overlay.textContent = message
      parent.postMessage({ type: 'tencent-avatar-player', status: 'error' }, location.origin)
    }

    if (!streamUrl.startsWith('webrtc://')) {
      fail('数字人播放地址无效')
    } else {
      try {
        player = new TcPlayer('player', {
          webrtc: streamUrl,
          width: '100%',
          height: '100%',
          autoplay: true,
          live: true,
          controls: 'none',
          webrtcConfig: { streamType: 'auto' },
          listener(event) {
            if (event.type === 'play') {
              overlay.hidden = true
              sound.hidden = false
              parent.postMessage({ type: 'tencent-avatar-player', status: 'ready' }, location.origin)
            }
            if (event.type === 'error') {
              const code = event.detail && event.detail.code
              if (code === 2005) muteUnderlyingVideo(() => player && player.play())
              else fail('数字人画面连接失败，请稍后重试')
            }
          },
        })
        muteUnderlyingVideo()
      } catch (_) {
        fail('数字人播放器初始化失败')
      }
    }

    sound.addEventListener('click', () => {
      if (!player) return
      player.mute(false)
      player.volume(1)
      document.querySelectorAll('#player video').forEach((video) => { video.muted = false; video.volume = 1 })
      sound.hidden = true
      parent.postMessage({ type: 'tencent-avatar-player', status: 'unmuted' }, location.origin)
    })
  </script>
</body>
</html>
